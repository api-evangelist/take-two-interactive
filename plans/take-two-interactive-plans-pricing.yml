description: >-
  Take-Two Interactive publishes NO API plans and NO API pricing — not a self-serve tier, and not
  a contact-sales tier either. This is an honest zero, not an enterprise gate: there is no page
  on any reachable Take-Two host that offers API access for sale under any commercial shape.
notes: >-
  The previous version of this file recorded a single "Contact Sales" plan. That plan was written
  by the 2026-05-04 bulk sweep and is not published by Take-Two anywhere; it has been removed
  rather than left standing as a claim we make on the company's behalf. Take-Two is a game
  publisher and holding company, and its labels (Rockstar Games, 2K, Zynga, Ghost Story Games)
  are profiled under their own records.
