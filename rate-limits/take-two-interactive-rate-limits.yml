created: '2026-05-04'
modified: '2026-09-06'
generated: '2026-09-06'
method: searched
source: >-
  Search of every reachable Take-Two surface for published rate limits, plus live inspection of
  the response headers returned by the two live Take-Two API hosts. Supersedes the 2026-05-04
  bulk sweep entry (roadmap#35).
reconciled: false
tags:
  - Gaming
  - Interactive Entertainment
  - Rate Limiting
description: >-
  Take-Two Interactive publishes no rate limits, and its live API hosts emit no rate-limit
  response headers on an unauthenticated request. An agent calling these hosts has no runtime
  signal — no RateLimit-*, no X-RateLimit-*, no Retry-After — and no documented number either.
notes: >-
  The previous version asserted a "see studio partner agreement" limit scoped to an account. No
  such agreement text is public, so that entry has been removed rather than left as an unsourced
  claim. Nothing observed is a rate limit: api.take2games.com returns a blanket 403 from a Google
  Cloud load balancer for every path (an authorization refusal, not throttling), and
  api.t2gp.take2games.com returns 404 on every path except /health, which returns 200 "OK" with
  no rate-limit headers.
limit_count: 0
limits: []
headers:
  published: []
  observed: []
  note: >-
    No RateLimit-*, X-RateLimit-*, or Retry-After header was returned by any probed Take-Two host.
responseCodes:
  throttled: null
  note: No documented status code on exhaustion; 429 was never observed.
sources:
  - url: https://api.t2gp.take2games.com/health
