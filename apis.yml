description: >-
  Take-Two Interactive Software, Inc. (NASDAQ: TTWO) is a US interactive-entertainment holding
  company headquartered in New York City that develops and publishes video games through its
  labels Rockstar Games, 2K, Zynga and Ghost Story Games. It is a Fortune 1000 corporation.
  Take-Two operates real API infrastructure — api.take2games.com and the T2GP (Take-Two Game
  Platform) API at api.t2gp.take2games.com, the backend behind its launcher and account system —
  but it runs no public developer program: no developer portal, no published reference, no
  machine-readable contract, no SDKs, and no plans or rate limits. Its developer-surface hosts
  (docs.take2games.com, dev.take2games.com) redirect every request to a FusionAuth SSO login.
