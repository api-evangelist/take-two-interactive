      - Interactive Entertainment
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    baseURL: https://api.take2games.com
    humanURL: https://www.take2games.com
    description: >-
      An undocumented Take-Two API host. api.take2games.com resolves to a Google Cloud load
      balancer that returns a bare 403 Forbidden on every path probed, including the root. The
      sibling T2GP platform host api.t2gp.take2games.com (CNAME api.t2gp.io) is demonstrably
      live — /health returns 200 "OK" — but answers 404 on every other path. No OpenAPI,
      Swagger, GraphQL SDL, AsyncAPI, WSDL or Protobuf contract is published for either host,
      and no /.well-known/ discovery document is served on any Take-Two host (56 probes across
      7 hosts, zero documents). humanURL points at the corporate site because the host formerly
      recorded here, developer.take2games.com, does not resolve.
    properties: []
